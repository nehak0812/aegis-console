<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%233987e5' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%23d03b3b'/></svg>" />
    <title>AEGIS · Cyber Risk Operations Center</title>
    <script>
      // set the theme before first paint (no flash): saved choice, else the OS preference
      try { var q = new URLSearchParams(location.search).get('theme'); if (q === 'dark' || q === 'dim' || q === 'light') localStorage.setItem('aegis-theme', q)
            var t = localStorage.getItem('aegis-theme'); if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t }
      catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
